# hw-heltecv4 — board HAL straddle for the Heltec WiFi LoRa 32 (V4).
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with reticulous/hw-heltecv4` and inherits the
# board's pin map, bring-up hook and hardware kconfig.
#
# Owns the V4 board HAL (esp-idf/src/heltecv4.cpp: the Vext peripheral power rail
# and the LoRa CS park). app_main, partitions, the OTA story and the browser SPA
# are NOT here — they belong to the buildable. Board reference:
# https://heltec.org/project/wifi-lora-32-v4/
#
# First cut: LoRa + Vext only. No on-device UI (OLED), no GNSS, no SD card —
# those peripherals exist on the board but are deliberately left unwired for now.
# This board adds nothing extra (no spangap-lcd): it builds headless.
schema_version: 1
name: reticulous/hw-heltecv4
prefix: heltecv4
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# Board bring-up hook. app_main is generated by the buildable; the build's
# start dispatcher calls this. heltecv4Start() is bare-hardware (Vext power rail
# + LoRa CS park) and runs before spangapInit(), so it is a start: hook. No
# init: hook — there is no on-device UI in this build.
start:
  - call: heltecv4Start
# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: 16 MB flash, 2 MB *quad* PSRAM (ESP32-S3R2). Unlike the
  # T-Deck's S3R8 (8 MB octal), the V4 carries only 2 MB in QUAD mode — so
  # SPIRAM_MODE_QUAD, not _OCT. The platform's "octal PSRAM" assumption does not
  # hold on this board; watch DRAM/PSRAM headroom.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPIRAM_MODE_QUAD=y
  # One SX1262 LoRa modem on its own SPI bus (separate from the flash bus).
  # Pins per the Heltec WiFi LoRa 32 V4 pin map. The SX1262 drives DIO2 as its
  # own RF antenna switch and DIO3 supplies the 1.8 V TCXO.
  - CONFIG_LORA_COUNT=1
  - CONFIG_LORA_SPI_HOST=2
  - CONFIG_LORA_SCK_PIN=9
  - CONFIG_LORA_MOSI_PIN=10
  - CONFIG_LORA_MISO_PIN=11
  - CONFIG_LORA0_CS_PIN=8
  - CONFIG_LORA0_DIO1_PIN=14
  - CONFIG_LORA0_BUSY_PIN=13
  - CONFIG_LORA0_RST_PIN=12
  - CONFIG_LORA0_TCXO_MV=1800
  - CONFIG_LORA0_DIO2_RF_SWITCH=y
  - CONFIG_LORA0_RADIO_SX1262=y
